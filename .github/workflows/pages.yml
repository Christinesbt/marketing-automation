name: Validate and Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check frontend syntax
        run: npm run check
        working-directory: marketing-console-prototype
      - name: Test workflows, language and deployment scope
        run: npm test
        working-directory: marketing-console-prototype
      - name: Package only frontend assets
        run: node scripts/build-pages.mjs
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified frontend
        id: deployment
        uses: actions/deploy-pages@v4
